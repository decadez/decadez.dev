name: Publish Web Dev UI

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag on main to retry
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      directory: packages/web-dev-ui
      ref: ${{ inputs.release-tag }}
    secrets: inherit
